[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyih"
version = "1.0.0"
description = "ManyIH: Benchmark for evaluating LLM instruction hierarchy resolution"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.8.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.28.0"]
vllm = ["vllm>=0.11.0"]
all = [
    "boto3>=1.28.0",
]

[project.scripts]
manyih = "manyih.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manyih*"]

[tool.setuptools.package-data]
manyih = ["data/*.json"]
